[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "catsprayer"
version = "0.1.0"
description = "AI powered cat detection and automated sprayer system"
requires-python = ">=3.11"

dependencies = [
    "picamera2",
    "numpy",
    "lgpio",
    "tomlkit"
]


[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "pytest"
]


#creates a catsprayer command that will run main() once the project is installed.
[project.scripts]
catsprayer = "catsprayer.main:main"


#tells setuptools to use the src/ layout.
[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


#[tool.black] and [tool.ruff] configure code formatting and linting so the whole project stays consistent.
[tool.black]
line-length = 88
target-version = ["py311"]


[tool.ruff]
line-length = 88
target-version = "py311"


[tool.pytest.ini_options]
testpaths = ["tests"]



#CatSprayer hardware configuration
[tool.catsprayer]

#Raspberry Pi GPIO pin connected to the sprayer driver circuit
sprayer_pin = 17

#true = software simulation mode
#false = use Raspberry Pi GPIO output
simulation = false

#Amount of time the sprayer remains active (seconds)
spray_duration = 0.5



#AI detection configuration
[tool.catsprayer.detector]

#Minimum confidence value required from the AI model
confidence_threshold = 0.5

#Number of consecutive detections required before triggering
required_detections = 2

#Amount of time a cat must remain detected before activation
trigger_delay = 0.0

#Minimum time between spray activations
cooldown_time = 2.5

#Spray zones: list of [x1, y1, x2, y2] rectangles, normalized 0.0-1.0 as a
#fraction of frame width/height. A cat is eligible to trigger the sprayer
#if its detection box is centered inside AT LEAST ONE spray zone (or there
#are no spray zones at all, meaning the whole frame counts). Editable live
#from the GUI's zone editor; this is just the value used on startup.
spray_zones = [[0.006711409395973154, 0.3983333333333333, 0.5503355704697986, 0.9816666666666667], [0.010738255033557046, 0.006666666666666667, 0.3865771812080537, 0.5433333333333333]]

#Exclusion zones: same format as spray_zones. A cat centered inside ANY
#exclusion zone is never eligible to trigger, even if it's also inside a
#spray zone. Exclusion always wins.
exclusion_zones = []



#Video/event recording configuration
max_box_fraction = 0.75
[tool.catsprayer.recording]

#Seconds of footage to include from BEFORE the triggering detection.
#Captured via a continuously-running in-memory ring buffer.
pre_event_seconds = 2.0

#Seconds to keep recording after the cat is no longer detected
post_event_seconds = 5.0

#Camera framerate, used to size the pre-event ring buffer correctly
fps = 30



#Camera configuration
[tool.catsprayer.camera]

#Main camera display resolution
width = 1920
height = 1080
